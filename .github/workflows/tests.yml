name: Reproducibility checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-paper.txt
      - run: python -m pip install -e '.[test,analysis]'
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: python benchmark_bbrl.py --out-dir outputs/ci-smoke --n-values 8 --points 3 --seeds 0 --strict-environment
